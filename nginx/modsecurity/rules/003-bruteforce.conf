#  003-bruteforce.conf
# Init IP collection for login attempts
SecAction \
    "id:100060,\
     phase:1,\
     nolog,\
     pass,\
     initcol:ip=%{REMOTE_ADDR}"

# Track login attempts and block after too many failures
SecRule REQUEST_METHOD "@streq POST" \
    "id:100061,\
     phase:2,\
     chain,\
     nolog,\
     pass,\
     setvar:ip.login_fail=+1,\
     expirevar:ip.login_fail=3600" \
SecRule REQUEST_METHOD "@streq POST" \
 "chain" \
SecRule RESPONSE_STATUS "@streq 401"

# Block IP after 5 failed login attempts
SecRule ip:login_fail "@gt 5" \
    "id:100062,\
     phase:2,\
     deny,\
     status:429,\
     log,\
     msg:'Too much login connection from same IP',\
     severity:'WARNING',\
     tag:'attack-bruteforce'"

# After 3 failed login attempts, show a CAPTCHA
# This rule is not fully implemented,
# it need to be handled by backend to display a CAPTCHA.
SecRule ip:login_fail "@gt 3" \
    "id:100063,\
     phase:2,\
     pass,\
     log,\
     msg:'Afficher CAPTCHA pour limiter bruteforce',\
     tag:'policy/bruteforce-captcha', \
	 redirect:'/login?captcha=1'"
