user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    ssl_protocols TLSv1.2 TLSv1.3;
    include       mime.types;
    server_tokens off;

    # Limit packet size
    client_body_buffer_size 128k;
    client_max_body_size 12m;


    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name DOMAIN_NAME;
    
    	location / {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                add_header Allow "GET, HEAD, OPTIONS" always;
                return 405;
            }
            return 301 https://$host$request_uri;
		}

    }

    # Main server block
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name DOMAIN_NAME;

        ssl_certificate /etc/nginx/certs/fullchain.pem_DOMAIN_NAME;
        ssl_certificate_key /etc/nginx/certs/privkey.pem_DOMAIN_NAME;
    
        # Enable ModSecurity
		modsecurity on;
		modsecurity_rules_file /etc/modsecurity/modsecurity.conf;
        # Additional nginx security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            # if <frame> will be use in project, change to "SAMEORIGIN" 
        add_header X-Frame-Options "DENY"                  always;  
        add_header X-Content-Type-Options "nosniff"       always; 
        add_header Referrer-Policy "strict-origin-when-cross-origin" always; 
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()"     always;


        location = /login {
          # Pour tester : toute requête POST renvoie 401
          if ($request_method = POST) {
            return 401;
          }
          # Autoriser GET pour la page de login (200)
          return 200;
        }
        location / {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                add_header Allow "GET, HEAD, OPTIONS" always;
                return 405;
            }
            proxy_pass http://web:WEB_PORT;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API server block
    server {
        ssl_certificate /etc/nginx/certs/fullchain.pem_DOMAIN_NAME;
        ssl_certificate_key /etc/nginx/certs/privkey.pem_DOMAIN_NAME;
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.DOMAIN_NAME;

        location / {
            proxy_pass http://sqlite_api:3000;
            proxy_set_header X-Proxy-Origin nginx;
        }
    }

    # WebSocket server block
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name pong.ws.DOMAIN_NAME;

        ssl_certificate /etc/nginx/certs/fullchain.pem_DOMAIN_NAME;
        ssl_certificate_key /etc/nginx/certs/privkey.pem_DOMAIN_NAME;

        location / {
            proxy_pass http://ws_server:3000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
