user www-data;
worker_processes auto;
pid /run/nginx.pid;
# ModSecurity loading file
load_module modules/ngx_http_modsecurity_module.so;



events {
    worker_connections 1024;
}

http {
    ssl_protocols TLSv1.2 TLSv1.3;
    include       mime.types;

	# Size limitations
	# This size can be modified if the project requires largers requests as big files uploads.
	client_body_buffer_size 128k;
	client_max_body_size 12m;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name DOMAIN_NAME;

        return 301 https://$host$request_uri;
    }



    # Main server block
    server {
        ssl_certificate /etc/nginx/certs/fullchain.pem_DOMAIN_NAME;
        ssl_certificate_key /etc/nginx/certs/privkey.pem_DOMAIN_NAME;

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name DOMAIN_NAME;

        # Enable ModSecurity
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # API server block
    server {
        ssl_certificate /etc/nginx/certs/fullchain.pem_api.DOMAIN_NAME;
        ssl_certificate_key /etc/nginx/certs/privkey.pem_api.DOMAIN_NAME;

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.DOMAIN_NAME;

        location / {
            proxy_pass http://api:API_PORT;
            proxy_set_header X-Proxy-Origin nginx;
        }
    }
}