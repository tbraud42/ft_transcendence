services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ft_transcendence-nginx:prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      WEB_PORT: 80
    volumes:
      - ./nginx/data/logs:/var/log/nginx
      - ./nginx/data/certs:/etc/nginx/certs
    depends_on:
      sqlite_api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_DOMAIN: ${DOMAIN_NAME}
        VITE_API_URL: api.${DOMAIN_NAME}
        VITE_PONG_WS_URL: pong.ws.${DOMAIN_NAME}
        VITE_NODE_ENV: production
    image: ft_transcendence-web:prod
    hostname: web
    expose:
      - "80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 3

  sqlite_api:
    build:
      context: ./sqlite_api
      dockerfile: Dockerfile
    image: ft_transcendence-sqlite_api:prod
    container_name: sqlite_api
    expose:
      - "3000"
    environment:
      DOMAIN: ${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}
    volumes:
      - ./sqlite_api/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

  ws_server:
    build:
      context: ./ws_server
      dockerfile: Dockerfile
    image: ft_transcendence-ws_server:prod
    container_name: ws_server
    expose:
      - "3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      API_URL: api.${DOMAIN_NAME}
    restart: unless-stopped
    extra_hosts:
      - "api.${DOMAIN_NAME}:host-gateway"
    networks:
      - backend

networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "frontend"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: "172.30.0.0/16" # We preset to keep a consistent network for firewall rules
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "backend"
      com.docker.network.bridge.enable_icc: "true"
