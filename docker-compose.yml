services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ft_transcendence-nginx:prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_PORT: ${API_PORT}
      MODSEC_MODE: ${MODSEC_MODE}
      WEB_PORT: 80
      VAULT_PORT: ${VAULT_PORT}
    volumes:
      - ./nginx/data/logs:/var/log/nginx
      - ./nginx/data/certs:/etc/nginx/certs
      - ./nginx/modsecurity:/etc/modsecurity
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ft_transcendence-web:prod
    hostname: web
    environment:
      API_URL: api.${DOMAIN_NAME}
    expose:
      - "80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    hostname: api
    environment:
      API_PORT: ${API_PORT}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  sqlite_api:
    build:
      context: ./sqlite_api
      dockerfile: Dockerfile
    container_name: sqlite_api
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_PORT: ${DATABASE_PORT}
    volumes:
      - ./sqlite_api/src:/app/src
      - ./sqlite_api/data:/app/data
      - ./sqlite_api/package.json:/app/package.json
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend
  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    container_name: vault
    hostname: vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./nginx/data/certs:/vault/certs
      - ./vault/config:/vault/config
      - ./vault_data:/vault/data
    environment:
      VAULT_ADDR: http://vault:8200
    entrypoint: ["", "arg"]
    command: vault server -config=/vault/config/vault.hcl
    restart: unless-stopped
    networks:
      - backend


networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "frontend"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: "172.30.0.0/16" # We preset to keep a consistent network for firewall rules
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "backend"
      com.docker.network.bridge.enable_icc: "true"

volumes:
  vault_data:
