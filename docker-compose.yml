services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ft_transcendence-nginx:prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: dev.local
      API_PORT: 3000
      MODSEC_MODE: On
      WEB_PORT: 80
      VAULT_PORT: 8200
    volumes:
      - ./nginx/data/logs:/var/log/nginx
      - ./nginx/data/certs:/etc/nginx/certs
    depends_on:
      sqlite_api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ft_transcendence-web:prod
    hostname: web
    environment:
      VITE_DOMAIN: dev.local #TODO: remove them and use vault env
      VITE_API_URL: http://api.dev.local
      VITE_PONG_WS_URL: ws://api.dev.local
      # VITE_DOMAIN: ${DOMAIN_NAME}
      # VITE_API_URL: api.${DOMAIN_NAME}
      # VITE_PONG_WS_URL: pong.ws.${DOMAIN_NAME}
    expose:
      - "80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 3


  sqlite_api:
    build:
      context: ./sqlite_api
      dockerfile: Dockerfile
    container_name: sqlite_api
    command: ["/scripts/vault-run.sh", "/secrets/sqlite_api/app.env", "node", "src/index.js"]
    expose:
      - "3000"
    # environment:
    #   JWT_SECRET: ${JWT_SECRET}
    #   DATABASE_PORT: ${DATABASE_PORT}
    #   CLIENT_ID: ${CLIENT_ID}
    #   CLIENT_SECRET: ${CLIENT_SECRET}
    #   REDIRECT_URI: ${REDIRECT_URI}
    volumes:
      - ./sqlite_api/data:/app/data
      - vault-secrets:/secrets:ro
      - ./shared:/scripts:ro
    depends_on:
      - vault_agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    container_name: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    tmpfs:
      - /run:rw,noexec,nosuid,nodev
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      VAULT_ADDR: https://vault:8200 # TODO: Change 8200 by an env variable
      VAULT_LOG_LEVEL: debug
      # VAULT_CACERT: "/vault/certs/vault.crt" #TODO: Check certs
    volumes:
      - ./data/file:/vault/file
      - ./vault/config:/vault/config
      # - ./vault/certs:/vault/certs
      - vault_data:/vault/data
      - ./secrets:/run/secrets:ro
      - ./nginx/data/certs:/vault/certs
    healthcheck:
      # test: ["CMD-SHELL", "test -s /vault/file/role_id.txt -a -s /vault/file/secret_id.txt"]
      test: ["CMD-SHELL", "curl -skf https://vault:8200/v1/sys/health | jq -e '.sealed==false' >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 40

  vault_agent:
    image: hashicorp/vault:1.16
    container_name: vault-agent
    command: ["/vault/vault-agent-entrypoint.sh"]
    cap_add:
      - IPC_LOCK
    depends_on:
      vault:
        condition: service_healthy
    volumes:
        # mount the SAME host folder for /vault/file as 'vault' service
      - ./data/file:/vault/file:ro
      # mount config and templates explicitly
      # - ./vault/config:/vault/config:ro
      # - ./vault/templates:/vault/templates:ro
      # shared tmpfs for rendered env files
      - vault-secrets:/secrets
      - ./vault:/vault
      # - vault-secrets:/secrets
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_TOKEN=root   # TODO: dev var only
      - VAULT_SKIP_VERIFY=true          # dev only
    healthcheck:
      test: ["CMD-SHELL", "[ -s /secrets/sqlite_api/app.env ]  && [ -s /secrets/ws_server/app.env ]"]
      interval: 2s
      timeout: 2s
      retries: 20
    # extra_hosts:
    #   - "dev.local:host-gateway"

  ws_server:
    build:
      context: ./ws_server
      dockerfile: Dockerfile
    container_name: ws_server
    expose:
      - "3000"
    command: ["/scripts/vault-run.sh", "/secrets/ws_server/app.env", "node", "src/index.js"]
    # environment:
    #   - API_URL=api.${DOMAIN_NAME}
    #   - JWT_SECRET=${JWT_SECRET}
    volumes:
      - vault-secrets:/secrets:ro
      - ./shared:/scripts:ro
    restart: unless-stopped
    depends_on:
      - vault_agent
    extra_hosts:
      - "api.dev.local:host-gateway"
    networks:
      - backend

networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "frontend"
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: "172.30.0.0/16" # We preset to keep a consistent network for firewall rules
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "backend"
      com.docker.network.bridge.enable_icc: "true"

volumes:
  vault_data:
  vault-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

